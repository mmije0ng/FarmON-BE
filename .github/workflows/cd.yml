name: CD - Deploy to EC2

on:
  workflow_run:
    workflows: [ "CI - Gradle Build & Docker Push" ]
    types: [ completed ]

permissions:
  contents: read

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'ci/cd' ||
       github.event.workflow_run.head_branch == 'develop' ||
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.KEY }}
          script: |
            set -e

            echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            cd /home/ubuntu

            if [ -f /home/ubuntu/docker-compose.yml ] && [ -f /home/ubuntu/docker-compose.dev.yml ]; then
              # grafana 볼륨 권한 사전 세팅
              sudo chown -R 472:472 /home/ubuntu/grafana

              # prometheus 볼륨 권한 사전 세팅 (Exited(2) 방지)
              sudo chown -R 65534:65534 /home/ubuntu/prometheus

              # 1) 백엔드 이미지 최신으로 pull (서비스명: backend)
              sudo docker compose \
                --env-file /home/ubuntu/.env \
                -f /home/ubuntu/docker-compose.yml \
                -f /home/ubuntu/docker-compose.dev.yml \
                pull backend

              # 2) 스프링 백엔드 컨테이너만 중지/삭제 후 재기동 (다른 컨테이너 유지)
              sudo docker compose \
                --env-file /home/ubuntu/.env \
                -f /home/ubuntu/docker-compose.yml \
                -f /home/ubuntu/docker-compose.dev.yml \
                stop backend || true

              sudo docker compose \
                --env-file /home/ubuntu/.env \
                -f /home/ubuntu/docker-compose.yml \
                -f /home/ubuntu/docker-compose.dev.yml \
                rm -f backend || true

              sudo docker compose \
                --env-file /home/ubuntu/.env \
                -f /home/ubuntu/docker-compose.yml \
                -f /home/ubuntu/docker-compose.dev.yml \
                up -d --no-deps --force-recreate backend

            else
              echo "docker-compose.yml or docker-compose.dev.yml not found. Exiting."
              exit 1
            fi

            sudo docker image prune -f
