name: CI - Gradle Build & Docker Push

on:
  push:
    branches: [ "ci/cd", "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # .env 생성
      - name: Make .env
        run: |
          printf "%s" "${{ secrets.ENV_DEV }}" > .env
          echo "✅ .env created with keys:"
          cut -d= -f1 .env | sort
        shell: bash

      # application-dev.yml 템플릿 생성 후 env 값 주입
      - name: Make application-dev.yml from secret template
        run: |
          mkdir -p src/main/resources
          printf "%s" "${{ secrets.APPLICATION_DEV_YML_TEMPLATE }}" > src/main/resources/application-dev.yml.template

          # 환경변수 로드 및 값 치환
          set -a
          source .env
          set +a

          envsubst < src/main/resources/application-dev.yml.template > src/main/resources/application-dev.yml

          echo "✅ application-dev.yml generated with environment substitution:"
          sed -n '1,40p' src/main/resources/application-dev.yml
        shell: bash

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle (skip test)
        run: ./gradlew clean build -x test
        shell: bash

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker image (latest)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
