name: CI - Gradle Build & Docker Push

on:
  push:
    branches: [ "ci/cd", "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make application-dev.yml
        run: |
          mkdir -p src/main/resources
          printf "%s" "${{ secrets.APPLICATION_DEV_YML }}" > src/main/resources/application-dev.yml
        shell: bash

      # secrets.ENV 하나로 .env 생성
      - name: Create .env from secret
        run: |
          printf "%s" "${{ secrets.ENV }}" > .env
        shell: bash

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # .env를 실제 환경변수로 로드한 상태에서 빌드
      - name: Build with Gradle (load .env)
        run: |
          set -a
          source .env
          set +a
          ./gradlew clean build
        shell: bash

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker image (latest)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
