language: ko

reviews:
  language: ko
  auto_review: true

  path_filters:
    include:
      - src/main/java/**
      - src/main/resources/**
      - src/test/java/**
    exclude:
      - "**/*.md"
      - "**/*.txt"

  rules:
    JavaStyle:
      enabled: true
    SpringBootBestPractices:
      enabled: true

  comment_style:
    behavior: DETAILED
    tone: POLITE
    language: ko

commit_message_generation:
  enabled: true
  language: ko

pull_request:
  summary:
    enabled: true
    language: ko
  labels:
    enabled: true

chat:
  enabled: true
  language: ko
