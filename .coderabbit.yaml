language: ko

reviews:
  auto_review: true

  path_filters:
    include:
      - src/main/java/**
      - src/main/resources/**
      - src/test/java/**
    exclude:
      - "**/*.md"
      - "**/*.txt"

  rules:
    JavaStyle:
      enabled: true
    SpringBootBestPractices:
      enabled: true

  comment_style:
    behavior: DETAILED
    tone: POLITE

  instructions: |
    아래 기준에 따라 코드 품질, 구조, 안정성을 면밀히 검토해줘.

    --------------------------------------------------
    1. 전체 구조·흐름(Sequence/Layer 흐름 관점)
    --------------------------------------------------
    - Controller → Service → Repository 흐름이 자연스럽고 일관적인가?
    - 불필요하게 깊은 호출 체계나 순환 의존 구조가 없는가?
    - 시퀀스 관점에서 책임 분리가 명확한가?
    - 특정 계층에서 과도한 책임을 떠안고 있지 않은가?

    --------------------------------------------------
    2. 예외 처리(Exception Handling)
    --------------------------------------------------
    - 예외 전파/처리가 올바르게 이루어졌는지 (try-catch, throws, @ControllerAdvice).
    - 커스텀 예외 사용이 적절하고 의미가 명확한지.
    - 예외 메시지에 민감 정보(DB, 사용자 데이터)가 포함되어 있지 않은지.
    - 비즈니스 로직에서 RuntimeException을 남발하지 않는지.

    --------------------------------------------------
    3. 코드 품질·가독성(Clean Code)
    --------------------------------------------------
    - 클래스/메서드가 단일 책임 원칙(SRP)을 준수하는가?
    - 함수 길이, 클래스 크기가 적절한가? (과도하게 비대하지 않은가)
    - 변수명, 메서드명, 패키지명이 역할을 명확히 드러내는가?
    - 매직 넘버/하드코딩 값이 존재하면 상수/설정 값으로 분리 가능한가?
    - 중복 로직이 발견되면 공통 컴포넌트로 추출 가능한가?

    --------------------------------------------------
    4. 성능·효율성(Performance)
    --------------------------------------------------
    - 불필요한 DB 쿼리, N+1 위험 여부를 점검.
    - Stream/loop 사용이 지나친 비용을 발생시키지 않는지.
    - 캐싱, 배치 처리, Lazy Loading 설정 등 성능 관련 옵션이 적절한지.
    - 정렬/필터링/조회 등이 데이터베이스 단계에서 처리 가능한지 확인.

    --------------------------------------------------
    5. 트랜잭션 관리(Transaction)
    --------------------------------------------------
    - 서비스 계층에서 @Transactional 사용이 적절한가?
    - 읽기 전용(readOnly = true) 옵션을 통해 조회 쿼리를 최적화했는가?
    - 트랜잭션 범위가 과도하거나 불필요하게 넓지 않은가?
    - 롤백 정책이 비즈니스 요구사항과 일치하는가?

    --------------------------------------------------
    6. 설계·아키텍처(Architecture)
    --------------------------------------------------
    - 패키지 구조가 도메인 중심 또는 계층 기반으로 명확하게 구성되었는가?
    - DTO/Entity 변환 규칙이 일관되고 중복되지 않는가?
    - Config/Bean 설정이 필요 이상으로 복잡하지 않은가?
    - 확장성, 유지보수성, 읽기 쉬운 아키텍처인지.

commit_message_generation:
  enabled: true
  language: ko

pull_request:
  summary:
    enabled: true
    language: ko
  labels:
    enabled: true

chat:
  enabled: true
