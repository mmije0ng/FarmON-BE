language: ko-KR

reviews:
  language: ko

  auto_review:
    enabled: true

  path_filters:
    - "**"

  high_level_summary: true
  high_level_summary_instructions: |
    PR 변경 내용을 한국어로 명확하고 간결하게 요약해 주세요.

    아래 형식을 반드시 지켜서 작성해 주세요.
    - 주요 변경 사항(3~7개): 무엇을/왜/어떻게 바뀌었는지 한 줄씩
    - 영향 범위: 영향을 받는 모듈/기능/엔드포인트/이벤트/테이블
    - 호환성/마이그레이션: 설정 변경, 데이터 마이그레이션, 배포 시 주의사항이 있으면 명시
    - 리스크 및 롤백 포인트: 잠재 리스크와 되돌리는 방법 또는 플래그/설정

  suggested_labels: true

  tone_instructions: |
    리뷰는 한국어로 작성하고, 정중하고 상세하게 설명해 주세요.
    단순 문제 지적이 아닌, 개선 가능한 구체적 대안을 함께 제시해 주세요.

  instructions: |
    다음 기준을 기반으로 Spring Boot 프로젝트 코드를 검토해 주세요.

    0. 변경 요약 보강
       - PR의 핵심 변경점이 무엇인지(기능/구조/성능/보안) 우선 정리해 주세요.
       - 변경 전/후 흐름이 달라졌다면, 어떤 경로가 추가/삭제/대체됐는지 설명해 주세요.

    1. 예외 처리
       - @ControllerAdvice / @ExceptionHandler를 통한 글로벌 예외 처리 여부
       - RuntimeException의 과도한 사용 여부
       - 에러 메시지 또는 로그에 민감 정보(비밀번호, 토큰 등)가 노출되지 않는지

    2. 코드 품질 & 구조
       - 단일 책임 원칙(SRP) 준수 여부
       - 중복 코드 존재 여부
       - DTO ↔ Entity 변환 구조가 계층 분리에 맞게 구현되어 있는지
       - Service 계층이 과도하게 비대해지지 않았는지

    3. Spring Web & REST API
       - HTTP 상태코드 사용이 표준에 맞는지
       - 컨트롤러에 비즈니스 로직이 존재하지 않는지
       - Request/Response DTO 설계가 적절한지

    4. JPA & Query 성능
       - 즉시 로딩(EAGER) 남용 여부
       - N+1 문제 가능성 여부
       - 불필요한 쿼리 발생 여부
       - fetch join 또는 batch size 사용이 가능한 부분은 없는지

    5. 트랜잭션 관리
       - @Transactional 위치가 올바른지 (Service 계층 중심)
       - readOnly = true 옵션이 조회성 트랜잭션에 적용되어 있는지
       - 트랜잭션 범위가 지나치게 넓지는 않은지

    6. 보안
       - 비밀번호/액세스 토큰/API Key 등 민감 정보가 로그로 출력되지 않는지
       - @Valid / Bean Validation 사용 여부
       - 인증/인가 우회 위험이 없는지

    7. 아키텍처 다이어그램/흐름 점검(추가)
       - PR 설명(본문)에 아키텍처 다이어그램이 포함돼 있다면, 다이어그램과 실제 코드 흐름이 일치하는지 확인해 주세요.
       - 다이어그램이 없다면, 주요 요청/이벤트 흐름을 텍스트로라도 단계별로 요약해 주세요.

    위 모든 항목을 고려해, 코드 개선점과 구체적인 수정 방법을 제안해 주세요.
