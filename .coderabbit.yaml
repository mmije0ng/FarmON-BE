# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR
tone_instructions: >
  Please write the review in Korean with a polite tone, and provide concrete improvement suggestions
  instead of only pointing out issues.
reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary_instructions: |-
    Please summarize the PR changes clearly and concisely in English.
    Follow the exact format below.
    - Key changes (3–7 items): one line each describing what/why/how it changed
    - Impact scope: affected modules/features/endpoints/events/tables
    - Compatibility/Migration: note any config changes, data migrations, or deployment precautions
    - Risks & rollback points: potential risks and how to revert (or flags/config to disable)
  high_level_summary_in_walkthrough: true
  collapse_walkthrough: false
  poem: false
  path_filters:
    - '**'
  path_instructions:
    - path: '**'
      instructions: >
        First, write a high-level summary in Korean using this exact structure:

        - Major changes (3–7 items): one line each describing what/why/how it changed

        - Impact scope: affected modules/features/endpoints/events/tables

        - Compatibility/Migration: config changes, data migrations, deployment notes (if any)

        - Risks & rollback points: potential risks and how to revert (flags/config/steps)


        Then review this Spring Boot project based on the criteria below.


        1. Exception handling
           - Check if global exception handling exists via @ControllerAdvice / @ExceptionHandler
           - Watch for excessive use of RuntimeException
           - Ensure sensitive info (passwords, tokens, etc.) is not exposed in error messages or logs

        2. Code quality & structure
           - Validate Single Responsibility Principle (SRP)
           - Identify duplicated code
           - Check whether DTO ↔ Entity conversion matches proper layer separation
           - Ensure Service layer is not overly bloated

        3. Spring Web & REST API
           - Verify HTTP status codes follow standards
           - Ensure controllers do not contain business logic
           - Validate Request/Response DTO design is appropriate

        4. JPA & query performance
           - Detect overuse of EAGER loading
           - Identify potential N+1 issues
           - Look for unnecessary queries
           - Suggest where fetch join or batch size could be applied

        5. Transaction management
           - Check @Transactional placement (prefer Service layer)
           - Apply readOnly = true for read-only transactions where applicable
           - Ensure transaction scope is not unnecessarily wide

        6. Security
           - Ensure sensitive data (passwords/access tokens/API keys) is not logged
           - Check use of @Valid / Bean Validation
           - Identify any authentication/authorization bypass risks

        7. Architecture diagram / flow validation
           - If the PR description includes an architecture diagram, verify it matches the actual code flow.
           - If there is no diagram, summarize the main request/event flows step-by-step in text.

        Considering all items above, propose improvements and provide concrete ways to implement
        them.
issue_enrichment:
  auto_enrich:
    enabled: true
